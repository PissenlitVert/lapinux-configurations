# Plugin natif « chat rain ».
# Le rendu, la pluie et les couleurs vivent dans liblapinux_plugin_chat.so.
id = "chat-de-bibliotheque"
name = "Miaou"
version = "4.0.0"
author = "La sieste"
description = "Ajoute une section Miaou dans la barre du haut : le plugin natif fait tomber une pluie de miaou."
